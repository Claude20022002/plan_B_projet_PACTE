# Journal d'accès sans secrets : jeton de l'agenda ICS et codes à usage unique masqués
map $request $requete_masquee {
    "~^(?<avant>\S+ /api/agenda/)[^/ ?]+(?<apres>\.ics.*)$"   "${avant}***${apres}";
    "~^(?<avant>.*[?&](code|token|c)=)[^& ]*(?<apres>.*)$"     "${avant}***${apres}";
    default                                                    $request;
}
log_format masque '$remote_addr - $remote_user [$time_local] "$requete_masquee" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log masque;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA : toutes les routes non-fichier → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bibliothèque (StudyLib) sous /biblio, même origine : la connexion Planner y est valable.
    # ^~ : prioritaire sur la règle de cache des fichiers statiques plus bas. Le préfixe est
    # retiré et transmis dans X-Forwarded-Prefix (StudyLib génère ses URL avec).
    location = /biblio {
        return 301 /biblio/;
    }
    location ^~ /biblio/ {
        proxy_pass         http://studylib:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Prefix /biblio;
        client_max_body_size 25m;
    }

    # Proxy vers le backend (évite les problèmes CORS en production).
    # Nom résolu à chaque requête par le DNS Docker : un backend recréé (nouvelle IP) reste joignable
    # sans redémarrer ce conteneur. Sans URI dans proxy_pass, le chemin /api/... est transmis tel quel.
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $backend_planner backend:5000;
        proxy_pass         http://$backend_planner;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache long terme sur les assets versionés (hash dans le nom) : « expires » pose lui-même
    # Cache-Control (max-age d'un an). Pas d'add_header ici : nginx n'hériterait plus des
    # en-têtes de sécurité ci-dessous pour ces fichiers.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|webp|ico)$ {
        expires 1y;
        access_log off;
    }

    # En-têtes de sécurité (les réponses de l'API ont aussi les leurs, posés par helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # L'application web n'utilise ni caméra, ni micro, ni géolocalisation (le scan du QR se fait dans l'app mobile)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Politique de contenu d'abord en observation (Report-Only) : rien n'est bloqué, les écarts
    # apparaissent dans la console du navigateur. À passer en Content-Security-Policy une fois vérifiée.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
