# ────────────────────────────────────────────────────────────────────────────
#  HESTIM Planner — docker-compose.yml
#
#  Services :
#    mysql    — Base de données MySQL 8
#    backend  — API Express/Sequelize (port 5000)
#    frontend — React/Vite servi par Nginx (port 80)
#    solver   — Génération de la semaine type (Timefold, Java 21), interne
#
#  Lancement :
#    docker compose --env-file .env.docker up -d --build
#  (--env-file est nécessaire : les ${…} de ce fichier, dont les mots de passe et
#   SOLVER_TOKEN, sont lus à l'interpolation, pas depuis env_file)
#
#  Premier démarrage (seed) :
#    docker compose exec backend node seed.js
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hestim_mysql
    restart: unless-stopped
    environment:
      # Aucun mot de passe par défaut : docker compose refuse de démarrer s'ils manquent
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requis dans .env.docker}
      MYSQL_DATABASE:      ${DB_NAME:-hestim_planner}
      MYSQL_USER:          ${DB_USER:-hestim}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?DB_PASSWORD requis dans .env.docker}
      # Base de StudyLib créée au premier démarrage (deploy/mysql-init)
      STUDYLIB_DB_PASSWORD: ${STUDYLIB_DB_PASSWORD:?STUDYLIB_DB_PASSWORD requis dans .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
      # Script d'initialisation optionnel (ex: créer des index supplémentaires)
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"   # debug depuis l'hôte uniquement, jamais exposé au réseau
    healthcheck:
      # MySQL redémarre une fois lors du premier boot pour appliquer la config
      # → start_period étendu à 90s pour absorber ce cycle
      # ping répond même sans identifiants : pas de mot de passe dans la ligne de commande
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - hestim_net

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    image: claude20022002/hestim-backend:latest   # docker.io/claude20022002/hestim-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Catalogue et moteur des jeux communs avec le web et le mobile (backend/Dockerfile : COPY --from=shared)
      additional_contexts:
        shared: ./shared
    container_name: hestim_backend
    restart: unless-stopped
    env_file: .env.docker          # fichier dédié Docker (voir .env.docker.example)
    environment:
      NODE_ENV:   production
      DB_HOST:    mysql            # nom du service MySQL dans le réseau Docker
      DB_NAME:    ${DB_NAME:-hestim_planner}
      DB_USER:    ${DB_USER:-hestim}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans .env.docker}
      PORT:       5000
      SOLVER_URL: http://solver:8080
      SOLVER_TOKEN: ${SOLVER_TOKEN:?SOLVER_TOKEN requis dans .env.docker}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:?INTEGRATION_TOKEN requis dans .env.docker}
      COOKIE_SAMESITE: strict
      # Caddy puis nginx : deux proxys devant l'API ; sinon toutes les requêtes auraient l'IP
      # de Caddy et le limiteur de débit des connexions bloquerait tout le monde à la fois
      TRUST_PROXY_HOPS: 2
      # Une seule origine publique (Caddy) : les cookies __Host- exigent HTTPS
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:?SITE_ADDRESS requis dans .env.docker}
      FRONTEND_URL: https://${SITE_ADDRESS}
      # Fournisseur OpenID Connect pour ClassQuiz (phase Q) ; CLASSQUIZ_OIDC_CLIENT_SECRET et
      # OIDC_COOKIE_KEYS viennent de .env.docker
      OIDC_ISSUER: https://${SITE_ADDRESS}/api/oidc
      QUIZ_URL: https://${QUIZ_ADDRESS:?QUIZ_ADDRESS requis dans .env.docker}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"   # le public passe par le frontend (nginx /api)
    depends_on:
      mysql:
        condition: service_healthy
      solver:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - hestim_net

  # ── Solveur (Timefold) ───────────────────────────────────────────────────
  # Jamais exposé : seul le backend l'appelle sur le réseau interne
  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    container_name: hestim_solver
    restart: unless-stopped
    environment:
      SOLVER_TOKEN: ${SOLVER_TOKEN:?SOLVER_TOKEN requis dans .env.docker}
      JAVA_OPTS: -XX:MaxRAMPercentage=75
    # Calcul gourmand en CPU : borné pour ne pas affamer l'API et la base
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    image: claude20022002/hestim-frontend:latest  # docker.io/claude20022002/hestim-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Logique et jetons communs avec l'application mobile (frontend/Dockerfile : COPY --from=shared)
      additional_contexts:
        shared: ./shared
      args:
        # En production avec proxy Nginx, /api suffit.
        # Pour un domaine séparé : VITE_API_URL=https://api.mondomaine.com/api
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: hestim_frontend
    restart: unless-stopped
    # Plus exposé directement : la passerelle Caddy (HTTPS) est la seule entrée publique
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_started   # frontend ne bloque pas sur backend healthy
    networks:
      - hestim_net

  # ── Passerelle publique (HTTPS) ──────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: hestim_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS requis dans .env.docker}
      FICHIERS_ADDRESS: ${FICHIERS_ADDRESS:?FICHIERS_ADDRESS requis dans .env.docker}
      QUIZ_ADDRESS: ${QUIZ_ADDRESS:?QUIZ_ADDRESS requis dans .env.docker}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - hestim_net

  # ── StudyLib (bibliothèque, ../StudyLib) ─────────────────────────────────
  # Même image pour le web, la file d'attente et le planificateur (planner:sync toutes les 15 min)
  studylib:
    image: claude20022002/hestim-studylib:latest
    build:
      context: ../StudyLib
      dockerfile: Dockerfile
    container_name: hestim_studylib
    restart: unless-stopped
    environment: &studylib_env
      APP_NAME: StudyLib
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${STUDYLIB_APP_KEY:?STUDYLIB_APP_KEY requis dans .env.docker}
      APP_URL: https://${SITE_ADDRESS}/biblio
      ASSET_URL: /biblio
      # Sélecteur d'espaces : lien vers les quiz (ClassQuiz) ; Planner et les Jeux sont sur la même origine
      QUIZ_URL: https://${QUIZ_ADDRESS}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: studylib
      DB_USERNAME: studylib
      DB_PASSWORD: ${STUDYLIB_DB_PASSWORD}
      SESSION_DRIVER: redis
      SESSION_PATH: /biblio
      SESSION_COOKIE: studylib_session
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requis dans .env.docker}
      FILESYSTEM_DISK: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis dans .env.docker}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis dans .env.docker}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_TEMPORARY_URL: https://${FICHIERS_ADDRESS}
      MINIO_BUCKET: studylib
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY requis dans .env.docker}
      PLANNER_API_URL: http://backend:5000/api
      PLANNER_LOGIN_URL: /connexion
      PLANNER_INTEGRATION_TOKEN: ${INTEGRATION_TOKEN}
      # Import Google Drive (studylib:import-drive) : clé du compte de service, montée ci-dessous
      GOOGLE_DRIVE_CREDENTIALS: /run/secrets/google/google-drive.json
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      # Correspondance dossier → module, posée à côté de la clé (facultative)
      GOOGLE_DRIVE_MODULE_MAP: /run/secrets/google/drive-modules.json
      # serversideup/php : migrations et caches Laravel au démarrage (conteneur web seulement)
      AUTORUN_ENABLED: "true"
    # Clé Drive montée en lecture seule, jamais copiée dans l'image (.dockerignore) ;
    # le dossier est monté plutôt que le fichier pour que son absence ne bloque pas le démarrage
    volumes:
      - ${GOOGLE_DRIVE_KEY_DIR:-../StudyLib/storage/app/private}:/run/secrets/google:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  studylib-queue:
    image: claude20022002/hestim-studylib:latest
    container_name: hestim_studylib_queue
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      <<: *studylib_env
      AUTORUN_ENABLED: "false"
    depends_on:
      - studylib
    # Pas de nginx dans ce conteneur : on vérifie que le worker tourne (le contrôle hérité de
    # l'image web interroge le port 8080 et le marquerait toujours « unhealthy »)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  studylib-scheduler:
    image: claude20022002/hestim-studylib:latest
    container_name: hestim_studylib_scheduler
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *studylib_env
      AUTORUN_ENABLED: "false"
    depends_on:
      - studylib
    # Pas de nginx dans ce conteneur : on vérifie que le worker tourne (le contrôle hérité de
    # l'image web interroge le port 8080 et le marquerait toujours « unhealthy »)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  redis:
    image: redis:7-alpine
    container_name: hestim_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - hestim_net

  minio:
    # MinIO ne publie plus d'images (Docker Hub minio/minio supprimé, quay.io privé) : version
    # communautaire reconstruite depuis les sources par Pigsty, identique à l'usage (S3, mc inclus)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: hestim_minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - hestim_net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: hestim_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - hestim_net

  # ── ClassQuiz (jeux pédagogiques, fork ../ClassQuiz, branche hestim) ──────
  # Sous-domaine QUIZ_ADDRESS : ClassQuiz ne s'installe pas sous un sous-chemin et ses routes
  # /api et /socket.io entreraient en collision avec celles de Planner. Les enseignants s'y
  # connectent par Planner (OpenID Connect) ; les étudiants jouent par code PIN, sans compte.
  quiz-api:
    image: claude20022002/hestim-classquiz-api:latest
    build:
      context: ../ClassQuiz
      dockerfile: Dockerfile
    container_name: hestim_quiz_api
    restart: unless-stopped
    environment: &quiz_env
      DB_URL: postgresql://classquiz:${QUIZ_DB_PASSWORD:?QUIZ_DB_PASSWORD requis dans .env.docker}@quiz-db:5432/classquiz
      # Redis de la plateforme, base 2 (StudyLib utilise les bases 0 et 1)
      REDIS: redis://:${REDIS_PASSWORD}@redis:6379/2?decode_responses=True
      SECRET_KEY: ${QUIZ_SECRET_KEY:?QUIZ_SECRET_KEY requis dans .env.docker}
      MAX_WORKERS: "1"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      MEILISEARCH_URL: http://quiz-meilisearch:7700
      ROOT_ADDRESS: https://${QUIZ_ADDRESS:?QUIZ_ADDRESS requis dans .env.docker}
      TELEMETRY_ENABLED: "false"
      # Comptes créés par Planner (adresse vérifiée) : ni inscription locale ni courriel
      REGISTRATION_DISABLED: "true"
      SKIP_EMAIL_VERIFICATION: "true"
      MAIL_ADDRESS: quiz@${SITE_ADDRESS}
      MAIL_USERNAME: quiz@${SITE_ADDRESS}
      MAIL_PASSWORD: inutilise
      MAIL_SERVER: localhost
      MAIL_PORT: "587"
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/data
      CUSTOM_OPENID_PROVIDER__CLIENT_ID: classquiz
      CUSTOM_OPENID_PROVIDER__CLIENT_SECRET: ${CLASSQUIZ_OIDC_CLIENT_SECRET:?CLASSQUIZ_OIDC_CLIENT_SECRET requis dans .env.docker}
      # Adresse publique : les points d'accès annoncés doivent être ceux que voit le navigateur
      CUSTOM_OPENID_PROVIDER__SERVER_METADATA_URL: https://${SITE_ADDRESS}/api/oidc/.well-known/openid-configuration
      # Fork HESTIM : « partie démarrée » signalée à Planner par le réseau interne (signé HMAC)
      HESTIM_WEBHOOK_URL: http://backend:5000/api/quiz/webhook
      HESTIM_WEBHOOK_SECRET: ${QUIZ_WEBHOOK_SECRET:?QUIZ_WEBHOOK_SECRET requis dans .env.docker}
    volumes:
      - quiz_data:/app/data
    depends_on:
      quiz-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  quiz-worker:
    image: claude20022002/hestim-classquiz-api:latest
    container_name: hestim_quiz_worker
    restart: unless-stopped
    command: ["arq", "classquiz.worker.WorkerSettings"]
    environment: *quiz_env
    volumes:
      - quiz_data:/app/data
    depends_on:
      - quiz-api
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  quiz-frontend:
    image: claude20022002/hestim-classquiz-frontend:latest
    build:
      context: ../ClassQuiz/frontend
      dockerfile: Dockerfile
      args:
        VITE_CUSTOM_OAUTH_NAME: HESTIM Planner
        VITE_REGISTRATION_DISABLED: "true"
        # Sélecteur d'espaces de ClassQuiz : retour vers Planner, la bibliothèque et les jeux
        VITE_PLANNER_URL: https://${SITE_ADDRESS}
    container_name: hestim_quiz_frontend
    restart: unless-stopped
    environment:
      API_URL: http://quiz-api:80
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2?decode_responses=True
    depends_on:
      - quiz-api
    security_opt:
      - no-new-privileges:true
    networks:
      - hestim_net

  # Base PostgreSQL propre à ClassQuiz (exception au MySQL partagé : ClassQuiz ne connaît que PostgreSQL)
  quiz-db:
    image: postgres:16-alpine
    container_name: hestim_quiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: classquiz
      POSTGRES_PASSWORD: ${QUIZ_DB_PASSWORD:?QUIZ_DB_PASSWORD requis dans .env.docker}
      POSTGRES_DB: classquiz
    volumes:
      - quiz_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classquiz -d classquiz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hestim_net

  # Meilisearch 0.28 : version imposée par le client de ClassQuiz, distincte de celle de StudyLib.
  # Interne au réseau Docker, jamais exposée.
  quiz-meilisearch:
    image: getmeili/meilisearch:v0.28.0
    container_name: hestim_quiz_meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - quiz_meili_data:/data.ms
    networks:
      - hestim_net

# ── Volumes persistants ────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  caddy_data:
  caddy_config:
  redis_data:
  minio_data:
  meili_data:
  quiz_data:
  quiz_db_data:
  quiz_meili_data:

# ── Réseau interne isolé ───────────────────────────────────────────────────
networks:
  hestim_net:
    driver: bridge
