name: CI HESTIM Planner

# Vérifications à chaque push sur main et à chaque pull request vers main.
# Pas de déploiement automatique : après une fusion sur main et tous les contrôles verts, la CI
# publie les images (job publier-images, lot ME-0b) ; le chef de projet les met en ligne sur le VPS
# par « deploy/vps/deployer.sh <commit> ». Les paquets majNN (preparer-maj.sh, appliquer-maj.sh)
# restent possibles pour StudyLib et ClassQuiz, et comme retour arrière du lot.
# Les anciens déploiements Railway et Vercel ont été retirés (décision du 2 octobre 2026).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule la vérification devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── 1. Site (React) ──────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Dépendances livrées (hors outils de développement) : une vulnérabilité haute ou critique bloque
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

      # Bloquant : une erreur échoue la CI (les avertissements react-hooks restent permis)
      - name: Lint
        run: npm run lint --if-present

      # Planner pour toute école : aucun nom d'école écrit en dur (serveur, site, application)
      - name: Nom de l'école jamais écrit en dur
        run: node ../scripts/verifier-neutre.mjs

      - name: Build de production
        run: npm run build
        env:
          VITE_API_URL: /api     # l'API est servie sur la même origine (/api)

  # ── 2. API Planner (Node + MySQL) ────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hestim_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Dépendances livrées (hors outils de développement) : une vulnérabilité haute ou critique bloque
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

      # Bloquant : une erreur échoue la CI (variable ou import inutilisé…). Les avertissements
      # « max-lines » signalent les fichiers à découper sans rien bloquer.
      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test --if-present
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci-not-production

      - name: Tests d'intégration (API + MySQL)
        run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hestim_test
          DB_USER: root
          DB_PASSWORD: root

      # Base de 18 000 séances, puis chaque route principale : statut 200 et nombre de requêtes
      # SQL dans son budget (une boucle N+1 introduite fait échouer la CI)
      - name: Banc des requêtes SQL (budget par route)
        run: |
          npm run banc:preparer
          npm run banc:requetes -- --verifier
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hestim_bench_test
          DB_USER: root
          DB_PASSWORD: root

  # ── 3. Application mobile (Expo) ─────────────────────────────────────────
  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Les vulnérabilités hautes connues sont dans l'outillage de build d'Expo (Metro, Jest, CLI),
      # absent de l'application installée, et le correctif proposé par npm rétrograderait Expo :
      # seule une vulnérabilité critique bloque ; le détail reste affiché dans le journal
      - name: Audit des dépendances
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npx eslint src

      - name: Tests
        run: npx jest --ci

  # ── 4. Solveur Timefold (Java) ───────────────────────────────────────────
  test-solver:
    name: Test Solveur
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: solver

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilation et tests
        run: mvn -B -ntp verify

  # ── 5. Parcours de démonstration (lot B-8) : site, serveur, MySQL et vrai solveur ──
  # Connexion, appel par QR, demande de report, génération puis publication, scénario IIIA.
  # Chaque passage repart d'une base jetable ; les comptes sont créés par la préparation
  # (frontend/tests/parcours/serveur.mjs), aucun identifiant n'est écrit dans les tests.
  # Ajouté après A-4, sans toucher à ses lignes : à fusionner après lui.
  test-parcours:
    name: Parcours de démonstration
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Installer les dépendances (site et serveur)
        run: |
          npm ci
          npm ci --prefix ../backend

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      # Le vrai solveur (décision du chef de projet) : son image est construite depuis solver/,
      # puis lancée par la configuration des parcours
      - name: Construire l'image du solveur
        run: docker build -t hestim-solver:parcours ../solver

      - name: Parcours
        run: npm run test:parcours
        env:
          CI: "true"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-parcours
          path: |
            frontend/playwright-report-parcours/
            frontend/test-results/
          retention-days: 7

  # ── 6. Scripts d'exploitation du serveur (lot ME-0b) ─────────────────────
  # La commande de mise en ligne (deploy/vps/deployer.sh) essayée sur un faux Docker : refus avant
  # tout changement, vérification des versions, historique et retour arrière
  test-scripts:
    name: Scripts d'exploitation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -x deploy/vps/deployer.sh deploy/vps/deploiement-commun.sh deploy/vps/tests/tester-deployer.sh

      - name: Tests de deployer.sh
        run: bash deploy/vps/tests/tester-deployer.sh

  # ── 7. Publication des images (lot ME-0b) ────────────────────────────────
  # Seulement après une fusion sur main et tous les contrôles verts : une image publiée a passé la
  # suite complète et les parcours. Étiquetées par le commit (complet et court) et « main » ; le
  # serveur les tire par « deployer.sh <commit> », qui vérifie l'étiquette revision.
  # Conception : docs/plans/planner-multi-etablissements/conception-me0b-deploiement.md
  publier-images:
    name: Publier ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-frontend, test-backend, test-mobile, test-solver, test-parcours, test-scripts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            contexte: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            contexte: frontend
            dockerfile: frontend/Dockerfile
          - image: solver
            contexte: solver
            dockerfile: solver/Dockerfile
          - image: exploitation
            contexte: deploy/vps
            dockerfile: deploy/vps/Dockerfile.exploitation

    steps:
      - uses: actions/checkout@v7

      # Noms d'images en minuscules (GHCR) ; « planner.source » : l'arbre des sources de l'image,
      # pour ne pas redémarrer le solveur quand il n'a pas changé
      - name: Registre, commit court et sources
        run: |
          echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "COURT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SOURCES=$(git rev-parse "HEAD:${{ matrix.contexte }}")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier hestim-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          # Code partagé avec le web et le mobile (COPY --from=shared du serveur et du site)
          build-contexts: shared=shared
          build-args: |
            VERSION_PLANNER=${{ github.sha }}
            VITE_API_URL=/api
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            planner.source=${{ env.SOURCES }}
          tags: |
            ${{ env.REGISTRE }}/hestim-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRE }}/hestim-${{ matrix.image }}:${{ env.COURT }}
            ${{ env.REGISTRE }}/hestim-${{ matrix.image }}:main
          push: true
