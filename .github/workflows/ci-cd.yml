name: CI HESTIM Planner

# Vérifications à chaque push sur main et à chaque pull request vers main.
# Pas de déploiement automatique : la production tourne sur le VPS (une seule origine Docker,
# mises à jour par paquets : deploy/vps/preparer-maj.sh puis appliquer-maj.sh sur le serveur).
# Les anciens déploiements Railway et Vercel ont été retirés (décision du 2 octobre 2026).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule la vérification devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── 1. Site (React) ──────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Dépendances livrées (hors outils de développement) : une vulnérabilité haute ou critique bloque
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

      # Bloquant : une erreur échoue la CI (les avertissements react-hooks restent permis)
      - name: Lint
        run: npm run lint --if-present

      - name: Build de production
        run: npm run build
        env:
          VITE_API_URL: /api     # l'API est servie sur la même origine (/api)

  # ── 2. API Planner (Node + MySQL) ────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hestim_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Dépendances livrées (hors outils de développement) : une vulnérabilité haute ou critique bloque
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

      - name: Tests unitaires
        run: npm test --if-present
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci-not-production

      - name: Tests d'intégration (API + MySQL)
        run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hestim_test
          DB_USER: root
          DB_PASSWORD: root

      # Base de 18 000 séances, puis chaque route principale : statut 200 et nombre de requêtes
      # SQL dans son budget (une boucle N+1 introduite fait échouer la CI)
      - name: Banc des requêtes SQL (budget par route)
        run: |
          npm run banc:preparer
          npm run banc:requetes -- --verifier
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hestim_bench_test
          DB_USER: root
          DB_PASSWORD: root

  # ── 3. Application mobile (Expo) ─────────────────────────────────────────
  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Les vulnérabilités hautes connues sont dans l'outillage de build d'Expo (Metro, Jest, CLI),
      # absent de l'application installée, et le correctif proposé par npm rétrograderait Expo :
      # seule une vulnérabilité critique bloque ; le détail reste affiché dans le journal
      - name: Audit des dépendances
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npx eslint src

      - name: Tests
        run: npx jest --ci

  # ── 4. Solveur Timefold (Java) ───────────────────────────────────────────
  test-solver:
    name: Test Solveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilation et tests
        run: mvn -B -ntp verify
