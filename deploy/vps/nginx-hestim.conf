# ── HESTIM (planner / fichiers / quiz) ─────────────────────────────────────
# Section ajoutée au nginx de FinAdminTech : elle ne fait que le HTTPS des trois
# sous-domaines et les renvoie à la plateforme HESTIM (/opt/hestim), dont le Caddy
# écoute sur 172.17.0.1:8090 (interface docker0, invisible depuis Internet).
# Pour la retirer : supprimer tout ce qui suit jusqu'à « FIN HESTIM », puis
#   docker exec finadmintech-web-1 nginx -t && docker exec finadmintech-web-1 nginx -s reload
# Le port 80 (validation ACME, redirection HTTPS) est déjà géré par le bloc default_server.
server {
    listen 443 ssl;
    http2 on;
    server_name planner.finadmintech.fr fichiers.finadmintech.fr quiz.finadmintech.fr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hestim/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hestim/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Documents de cours (StudyLib) jusqu'à 20 Mo, imports CSV
    client_max_body_size 25m;

    location / {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr (et non l'en-tête du client) : l'IP vue par les limiteurs de débit
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (parties ClassQuiz en direct)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_hestim;
        proxy_read_timeout 120s;
    }
}

map $http_upgrade $connection_upgrade_hestim {
    default upgrade;
    ""      close;
}
# ── FIN HESTIM ─────────────────────────────────────────────────────────────
