# Service interne : jamais exposé publiquement (seul Planner l'appelle)
server.port=${PORT:8080}
spring.application.name=hestim-solver

# Durée par défaut d'un calcul (Planner peut la réduire ou l'allonger jusqu'à 600 s)
timefold.solver.termination.spent-limit=60s
# Plusieurs calculs en parallèle (une préparation par filière, par exemple)
timefold.solver-manager.parallel-solver-count=AUTO

# Planner envoie seulement les champs utiles ; les autres sont ignorés
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
