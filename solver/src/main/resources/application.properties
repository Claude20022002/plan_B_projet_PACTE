# Service interne : jamais exposé publiquement (seul Planner l'appelle)
server.port=${PORT:8080}
spring.application.name=hestim-solver

# Durée par défaut d'un calcul (Planner peut la réduire ou l'allonger jusqu'à 600 s)
timefold.solver.termination.spent-limit=60s
# Deux calculs en parallèle au plus (au-delà : 429), pour borner CPU et mémoire
timefold.solver-manager.parallel-solver-count=2
solver.calculs-simultanes-max=2

# Sécurité : jeton partagé avec Planner (32 caractères au moins), corps de requête borné
solver.jeton=${SOLVER_TOKEN:}
solver.taille-max-octets=5242880
server.tomcat.max-swallow-size=5MB
server.error.include-stacktrace=never
server.error.include-message=never

# Planner envoie seulement les champs utiles ; les autres sont ignorés
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
